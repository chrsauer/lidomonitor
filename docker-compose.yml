services:
  lidomonitor:
    build: .
    image: lidomonitor:latest
    container_name: lidomonitor
    restart: unless-stopped
    env_file: .env
    volumes:
      - lidomonitor-data:/data
      # VC-Zuordnung: ./config/validators.csv (Pubkey;Bezeichnung)
      - ./config:/config:ro
    # Host-Netzwerk: Nodes auf demselben Server sind direkt über localhost
    # erreichbar (z. B. EXECUTION_URLS=http://localhost:8545).
    # Der Monitor öffnet selbst keine Ports.
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lidomonitor-data:
